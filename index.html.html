<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Scottish Pairs 2026</title>
<meta name="theme-color" content="#0F2418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scottish Pairs">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230065BD'/%3E%3Cline x1='6' y1='6' x2='94' y2='94' stroke='white' stroke-width='20'/%3E%3Cline x1='94' y1='6' x2='6' y2='94' stroke='white' stroke-width='20'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230065BD'/%3E%3Cline x1='6' y1='6' x2='94' y2='94' stroke='white' stroke-width='20'/%3E%3Cline x1='94' y1='6' x2='6' y2='94' stroke='white' stroke-width='20'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;700;900&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F2418;
  --bg-alt:#16311F;
  --bg-raised:#1D3B28;
  --paper:#F3ECDA;
  --paper-dim:#E7DEC6;
  --ink:#1C1B14;
  --ink-soft:#5A5647;
  --cream-ink:#EDE7D6;
  --cream-ink-dim:#A9B5A9;
  --gold:#D8B24C;
  --silver:#B9C2C9;
  --bronze:#C08552;
  --red:#B23A2E;
  --green-acc:#5C9A6B;
  --saltire:#0065BD;
  --line:#2A4A34;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(circle at 15% 0%, rgba(216,178,76,0.08), transparent 40%),
    radial-gradient(circle at 85% 100%, rgba(0,101,189,0.10), transparent 45%);
  color:var(--cream-ink);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
#app{max-width:560px;margin:0 auto;}
header.top{
  padding:calc(20px + env(safe-area-inset-top)) 20px 14px;
  display:flex; align-items:center; justify-content:space-between;
}
header.top .brand{display:flex; align-items:center; gap:11px;}
.saltire{width:34px;height:26px;border-radius:4px;position:relative;overflow:hidden;background:var(--saltire);flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,0.35);}
.saltire i{position:absolute;top:50%;left:50%;width:150%;height:7px;background:#fff;}
.saltire i.a{transform:translate(-50%,-50%) rotate(28deg);}
.saltire i.b{transform:translate(-50%,-50%) rotate(-28deg);}
header.top h1{
  font-family:'Big Shoulders',sans-serif; font-weight:900; letter-spacing:0.3px;
  font-size:22px; margin:0; text-transform:uppercase; line-height:0.95;
  color:var(--paper);
}
header.top .sub{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--cream-ink-dim);margin-top:3px;}
main{padding:0 16px 20px;}
.card{
  background:var(--paper); color:var(--ink); border-radius:var(--radius);
  padding:16px; margin-bottom:14px; box-shadow:0 6px 18px rgba(0,0,0,0.25);
}
.card h2{
  font-family:'Big Shoulders',sans-serif; font-size:19px; text-transform:uppercase;
  letter-spacing:0.5px; margin:0 0 10px; font-weight:700; color:var(--ink);
  display:flex; align-items:center; justify-content:space-between;
}
.panel-dark{background:var(--bg-raised); border-radius:var(--radius); padding:16px; margin-bottom:14px; border:1px solid var(--line);}
.panel-dark h2{font-family:'Big Shoulders',sans-serif; font-size:19px; text-transform:uppercase; margin:0 0 10px; color:var(--paper); font-weight:700; display:flex; align-items:center; justify-content:space-between;}
.muted{color:var(--ink-soft); font-size:13px;}
.muted-dark{color:var(--cream-ink-dim); font-size:13px;}

/* Podium */
.podium{display:flex; align-items:flex-end; gap:8px; margin:6px 0 16px; padding:0 4px;}
.podium .spot{flex:1; text-align:center;}
.podium .bar{border-radius:8px 8px 0 0; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; color:var(--ink); font-family:'Roboto Mono',monospace; font-weight:700; padding-bottom:6px;}
.podium .p1 .bar{height:92px; background:linear-gradient(180deg,#EAC96C,var(--gold));}
.podium .p2 .bar{height:70px; background:linear-gradient(180deg,#D3DCE1,var(--silver));}
.podium .p3 .bar{height:52px; background:linear-gradient(180deg,#D39B6E,var(--bronze));}
.podium .rank{font-family:'Big Shoulders',sans-serif; font-size:22px; font-weight:900;}
.podium .name{font-family:'Inter',sans-serif; font-size:11.5px; font-weight:700; margin-top:6px; color:var(--paper); line-height:1.2;}
.podium .pts{font-size:10.5px; color:var(--cream-ink-dim); margin-top:1px;}

/* Leaderboard rows */
.lb-row{display:flex; align-items:center; gap:10px; padding:10px 6px; border-bottom:1px solid #E3DAC0;}
.lb-row:last-child{border-bottom:none;}
.lb-pos{font-family:'Big Shoulders',sans-serif; font-weight:900; font-size:19px; width:24px; color:var(--ink-soft); text-align:center;}
.lb-pos.gold{color:#A57F1F;} .lb-pos.silver{color:#6E7880;} .lb-pos.bronze{color:#8C5A34;}
.lb-info{flex:1; min-width:0;}
.lb-team{font-weight:700; font-size:14.5px;}
.lb-players{font-size:11px; color:var(--ink-soft); margin-top:1px;}
.lb-val{font-family:'Roboto Mono',monospace; font-weight:700; font-size:16px; text-align:right; min-width:48px;}
.lb-strokes{font-size:10.5px; color:var(--ink-soft); text-align:right; margin-top:1px;}
.chip{display:inline-block; font-family:'Roboto Mono',monospace; font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:20px; margin-left:6px;}
.chip.minus{background:rgba(92,154,107,0.18); color:#2F6B3D;}
.chip.plus{background:rgba(178,58,46,0.14); color:var(--red);}
.chip.tie{background:rgba(216,178,76,0.22); color:#8A6A1F;}
.chip.flat{background:rgba(169,181,169,0.18); color:var(--ink-soft);}

/* Tabs */
nav.tabbar{
  position:fixed; bottom:0; left:0; right:0; background:var(--bg-raised);
  border-top:1px solid var(--line); padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  display:flex; justify-content:center; gap:4px; z-index:20;
}
nav.tabbar .wrap{display:flex; gap:4px; max-width:560px; width:100%;}
nav.tabbar button{
  flex:1; background:transparent; border:none; color:var(--cream-ink-dim);
  font-family:'Inter',sans-serif; font-size:10.5px; font-weight:600; letter-spacing:0.2px;
  padding:8px 2px; border-radius:10px; display:flex; flex-direction:column; align-items:center; gap:3px;
}
nav.tabbar button .ic{font-size:16px;}
nav.tabbar button.active{background:rgba(216,178,76,0.14); color:var(--gold);}

/* Forms */
label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-soft); margin:10px 0 4px;}
label:first-child{margin-top:0;}
input[type=text], input[type=number], input[type=date], select{
  width:100%; padding:10px 12px; border-radius:9px; border:1px solid #D8CDA9;
  background:#FBF8EF; font-family:'Inter',sans-serif; font-size:15px; color:var(--ink);
}
input:focus{outline:2px solid var(--gold); outline-offset:1px;}
.row2{display:flex; gap:10px;}
.row2 > div{flex:1;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:11px 16px; border-radius:10px; border:none; font-family:'Inter',sans-serif;
  font-weight:700; font-size:13.5px; cursor:pointer; width:100%; margin-top:12px;
}
.btn-primary{background:var(--gold); color:#241B04;}
.btn-ghost{background:transparent; border:1px solid var(--line); color:var(--cream-ink);}
.btn-danger{background:transparent; border:1px solid rgba(178,58,46,0.4); color:#E28477;}
.team-item, .round-item{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:11px 4px; border-bottom:1px solid var(--line);
}
.team-item:last-child, .round-item:last-child{border-bottom:none;}
.team-item .tinfo{font-size:13.5px;} .team-item .tname{font-weight:700; color:var(--paper);}
.team-item .tplayers{color:var(--cream-ink-dim); font-size:12px; margin-top:1px;}
.round-item .rname{font-weight:700; color:var(--paper); font-size:14px;}
.round-item .rstatus{font-size:11px; color:var(--cream-ink-dim); margin-top:1px;}
.icon-btn{background:none; border:none; color:var(--cream-ink-dim); font-size:16px; padding:6px;}

/* Scores entry */
.score-block{padding:11px 4px; border-bottom:1px solid #E3DAC0;}
.score-block:last-child{border-bottom:none;}
.score-block .sname{font-size:13.5px; font-weight:700; display:flex; align-items:center; flex-wrap:wrap; gap:5px;}
.score-block .splayers{font-size:11px; color:var(--ink-soft); font-weight:400; width:100%; margin-top:1px;}
.score-inputs{display:flex; gap:8px; margin-top:8px; align-items:flex-end;}
.score-inputs .fld{flex:1;}
.score-inputs .fld span{display:block; font-size:9.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); margin-bottom:3px;}
.score-inputs input{text-align:center; font-family:'Roboto Mono',monospace; font-weight:700; font-size:15px; padding:8px 4px;}
.net-box{flex:0 0 auto; text-align:center; min-width:52px;}
.net-box span{display:block; font-size:9.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); margin-bottom:3px;}
.net-box .netval{font-family:'Roboto Mono',monospace; font-weight:900; font-size:17px; color:var(--ink);}
.carry-note{font-size:10px; color:var(--ink-soft); margin-top:4px;}
.tiebreak-row{background:#F7F0DC; border:1px dashed #C9A83A; border-radius:8px; padding:8px 10px; margin-top:8px;}
.tiebreak-row .tb-label{font-size:10.5px; font-weight:700; color:#8A6A1F; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:6px;}
.round-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:4px;}
.round-tabs::-webkit-scrollbar{display:none;}
.round-pill{flex:0 0 auto; padding:7px 13px; border-radius:20px; background:var(--bg-raised); border:1px solid var(--line); color:var(--cream-ink-dim); font-size:12px; font-weight:700;}
.round-pill.active{background:var(--gold); color:#241B04; border-color:var(--gold);}
.round-pill.done:after{content:' ✓';}
.round-pill.tied:after{content:' ⚑';}
.round-pill.waiting:after{content:' …';}

.empty{text-align:center; padding:30px 10px; color:var(--cream-ink-dim); font-size:13.5px;}
.toggle2{display:flex; background:var(--bg-raised); border-radius:11px; padding:3px; margin-bottom:14px; border:1px solid var(--line);}
.toggle2 button{flex:1; background:none; border:none; padding:9px; border-radius:8px; color:var(--cream-ink-dim); font-family:'Inter',sans-serif; font-weight:700; font-size:12.5px;}
.toggle2 button.active{background:var(--gold); color:#241B04;}
.matrix{width:100%; border-collapse:collapse; font-size:11px;}
.matrix th,.matrix td{padding:6px 4px; text-align:center; border-bottom:1px solid #E3DAC0;}
.matrix th{color:var(--ink-soft); font-weight:600; font-size:10px; text-transform:uppercase;}
.matrix td.team-col, .matrix th.team-col{text-align:left; font-weight:700;}
.toast{
  position:fixed; bottom:calc(90px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background:var(--gold); color:#241B04; padding:9px 18px; border-radius:20px; font-weight:700;
  font-size:13px; z-index:50; box-shadow:0 6px 16px rgba(0,0,0,0.3); opacity:0; pointer-events:none;
  transition:opacity 0.25s, transform 0.25s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="saltire"><i class="a"></i><i class="b"></i></div>
      <div>
        <h1>Scottish Pairs 2026</h1>
        <div class="sub">5 rounds &middot; pairs better-ball</div>
        <div class="sub" id="conn-status" style="margin-top:2px;">🟡 Connecting…</div>
      </div>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabbar"><div class="wrap">
  <button data-tab="leaderboard"><span class="ic">🏆</span>Overall</button>
  <button data-tab="scores"><span class="ic">⛳</span>Daily</button>
  <button data-tab="betting"><span class="ic">💰</span>Bets</button>
  <button data-tab="courses"><span class="ic">📍</span>Courses</button>
  <button data-tab="setup"><span class="ic">⚙️</span>Setup</button>
</div></nav>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { initializeFirestore, persistentLocalCache, doc, setDoc, updateDoc, deleteField, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

// ---- Firebase project config ----
// Create a project at https://console.firebase.google.com, add a Web App,
// enable Firestore (Native mode), then paste that app's config below.
const firebaseConfig = {
  apiKey: "AIzaSyCHdHOlR1VwxDznokP3xKyUQVl9ImLUIZQ",
  authDomain: "scotish-pairs-2026.firebaseapp.com",
  projectId: "scotish-pairs-2026",
  storageBucket: "scotish-pairs-2026.firebasestorage.app",
  messagingSenderId: "832919181055",
  appId: "1:832919181055:web:3e1c3e9aefadd8b1c81eca"
};

const fbApp = initializeApp(firebaseConfig);
const db = initializeFirestore(fbApp, { localCache: persistentLocalCache() });
const stateRef = doc(db, "competition", "scottishPairs2026");

// Anyone with the link can view everything live. Editing (scores, pairings,
// courses, prizes, resets) is locked behind this PIN — change it to whatever
// you like, it only lives in this file, not in Firestore.
const ADMIN_PIN = "4321";
let isAdmin = localStorage.getItem('sp2026_admin') === 'yes';

const SCORE_MODEL = 'net-v1';
const DEFAULT_TEAMS = 12;
const DEFAULT_ROUNDS = 5;

function uid(p){ return p + Math.random().toString(36).slice(2,9); }

function defaultState(){
  const teams = defaultPairNames().map(([p1,p2])=>({id:uid('t'), name:p1+' & '+p2, p1, p2}));
  const courseNames = ['Kirriemuir','Alyth','Strathmore','Forfar','Blairgowrie'];
  const rounds = Array.from({length:DEFAULT_ROUNDS}, (_,i)=>({id:uid('r'), course:courseNames[i]||'', date:''}));
  const prizes = { daily:[60,40,30,20], overall:[200,150,100] };
  return { teams, rounds, scores:{}, prizes, manualPenalties:{}, betting:{markets:{}, bets:{}}, scoreModel:SCORE_MODEL, activeRound: rounds[0] ? rounds[0].id : null };
}
function defaultPairNames(){
  return [
    ['Matt','Al'], ['Paul','Mick'], ['Sam','Bails'], ['Nick','Mogga'],
    ['Paz','Paul'], ['Gregg','Dude'], ['Charlie','Jim'], ['Dave','Billy'],
    ['Si','James'], ['Hendo','Briz'], ['Jack','Ben'], ['Oli','Jay P']
  ];
}

let state = defaultState();
let ready = false;

// Runs on every snapshot. Returns true if it changed anything that needs writing back.
function runMigrations(){
  let changed = false;
  if(!state.prizes){ state.prizes = { daily:[60,40,30,20], overall:[200,150,100] }; changed = true; }
  if(!state.manualPenalties){ state.manualPenalties = {}; changed = true; }
  if(!state.betting){ state.betting = {markets:{}, bets:{}}; changed = true; }
  if(Array.isArray(state.betting.bets)){
    // Migrate from the old array-based bets (which could clobber concurrent bets)
    // to a keyed map, so each bet lives at its own safe-to-update path.
    const asMap = {};
    state.betting.bets.forEach(b=>{ if(b && b.id) asMap[b.id] = b; });
    state.betting.bets = asMap;
    changed = true;
  }

  // Patch any still-default "Pair N" slots (untouched, no players) with the real pairings.
  const pairNames = defaultPairNames();
  state.teams.forEach((t,i)=>{
    if(i < pairNames.length && /^Pair \d+$/.test(t.name) && !t.p1 && !t.p2){
      const [p1,p2] = pairNames[i];
      t.name = p1+' & '+p2; t.p1 = p1; t.p2 = p2;
      changed = true;
    }
  });

  // One-off reset: scoring model changed to the net-score / carry-forward adjustment system.
  if(state.scoreModel !== SCORE_MODEL){
    state.scores = {};
    state.scoreModel = SCORE_MODEL;
    changed = true;
  }

  // Fill in the real course names for any day left blank, and rename Baz -> Paz.
  const courseNames = ['Kirriemuir','Alyth','Strathmore','Forfar','Blairgowrie'];
  state.rounds.forEach((r,i)=>{
    if(!r.course && courseNames[i]){ r.course = courseNames[i]; changed = true; }
  });
  state.teams.forEach(t=>{
    let touched = false;
    if(t.p1==='Baz'){ t.p1='Paz'; touched = true; }
    if(t.p2==='Baz'){ t.p2='Paz'; touched = true; }
    if(touched){ t.name = [t.p1,t.p2].join(' & '); changed = true; }
  });

  return changed;
}

// Full-document save — used for admin-only, infrequent, single-editor operations
// (pairings, courses, prizes, resets, imports) where a whole-state overwrite is fine.
function save(){
  setDoc(stateRef, state).then(()=>{
    setConnStatus('live');
  }).catch(err=>{
    console.error(err);
    setConnStatus('error');
    toast('Could not sync — check connection');
  });
}

// Targeted field update — used for anything multiple people can be doing at once
// (entering scores, placing bets, countback, manual adjustments). Only touches the
// exact dot-paths given, so two people editing different things at the same moment
// can never clobber each other, unlike a full-document save which replaces
// everything with whatever that one client last had in memory.
function saveField(updates){
  updateDoc(stateRef, updates).then(()=>{
    setConnStatus('live');
  }).catch(err=>{
    console.error(err);
    setConnStatus('error');
    toast('Could not sync — check connection');
  });
}

function setConnStatus(mode){
  const el = document.getElementById('conn-status');
  if(!el) return;
  if(mode==='live') el.innerHTML = '🟢 Live';
  else if(mode==='connecting') el.innerHTML = '🟡 Connecting…';
  else el.innerHTML = '🔴 Offline — edits saved to this device only';
}

// If a Firestore update lands while the user has a form field focused (picking a date,
// mid-keystroke in a number field), rebuilding the DOM right then kills native pickers
// and drops the interaction. Defer the render until they're done with that field.
let interacting = false;
let renderPending = false;
document.addEventListener('focusin', (e)=>{
  if(e.target.matches && e.target.matches('#view input, #view select')) interacting = true;
});
document.addEventListener('focusout', (e)=>{
  if(e.target.matches && e.target.matches('#view input, #view select')){
    interacting = false;
    if(renderPending){ renderPending = false; render(); }
  }
});
function safeRender(){
  if(interacting) renderPending = true;
  else render();
}

onSnapshot(stateRef, { includeMetadataChanges: true }, (snap)=>{
  // Our own writes echo straight back with hasPendingWrites=true — we've already
  // rendered those optimistically below, so skip the rebuild and just keep the
  // in-memory state in sync. This is what stops open date pickers / focused
  // inputs from being torn down mid-interaction.
  if(snap.metadata.hasPendingWrites){
    if(snap.exists()) state = snap.data();
    return;
  }
  if(snap.exists()){
    state = snap.data();
  } else {
    state = defaultState();
    setDoc(stateRef, state);
  }
  const changed = runMigrations();
  ready = true;
  setConnStatus('live');
  if(changed) save(); else safeRender();
}, (err)=>{
  console.error(err);
  setConnStatus('error');
  document.getElementById('view').innerHTML = `<div class="card"><div class="empty">Couldn't connect to Firebase.<br>Check the firebaseConfig at the top of the HTML file matches your Firebase project, and that Firestore is enabled.</div></div>`;
});
setConnStatus('connecting');

function money(n){ return '£'+Number(n||0).toLocaleString('en-GB'); }
function signedNum(n){ return (n>0?'+':'') + n; }
function dailyPrize(rank){ const p = state.prizes.daily; return (rank>=1 && rank<=p.length) ? p[rank-1] : null; }
function overallPrize(pos){ const p = state.prizes.overall; return (pos>=1 && pos<=p.length) ? p[pos-1] : null; }


function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ---------- scoring engine ---------- */
function getScore(roundId, teamId){
  const rs = state.scores[roundId] || {};
  const s = rs[teamId];
  return (s && typeof s==='object') ? s : {};
}
function setScoreField(roundId, teamId, field, val){
  if(!state.scores[roundId]) state.scores[roundId] = {};
  if(!state.scores[roundId][teamId]) state.scores[roundId][teamId] = {};
  if(val===null || val===undefined || isNaN(val)) delete state.scores[roundId][teamId][field];
  else state.scores[roundId][teamId][field] = val;
}
// Mutates local state and pushes only that one field to Firestore, so two people
// entering different pairs' scores at the same moment never overwrite each other.
function saveScoreField(roundId, teamId, field, val){
  setScoreField(roundId, teamId, field, val);
  const path = `scores.${roundId}.${teamId}.${field}`;
  saveField({ [path]: (val===null||val===undefined||isNaN(val)) ? deleteField() : val });
}
function hasTotal(s){ return typeof s.f9==='number' && typeof s.b9==='number'; }
function grossTotal(s){ return s.f9 + s.b9; }

function clusterBy(arr, keyFn){
  const sorted = [...arr].sort((a,b)=> keyFn(a)-keyFn(b));
  const out = [];
  let i=0;
  while(i<sorted.length){
    let j=i;
    while(j+1<sorted.length && keyFn(sorted[j+1])===keyFn(sorted[i])) j++;
    out.push(sorted.slice(i,j+1));
    i=j+1;
  }
  return out;
}

// entries: [{teamId, net, b9, l6, l3}] — clusters by net, then countback on real holes (b9, l6, l3)
function buildOrder(entries){
  let clusters = clusterBy(entries, e=>e.net);
  let blocking = null;
  clusters = clusters.flatMap(cluster=>{
    if(cluster.length===1 || blocking) return [cluster];
    return clusterBy(cluster, e=>e.b9);
  });
  clusters = clusters.flatMap(cluster=>{
    if(cluster.length===1 || blocking) return [cluster];
    const haveAll = cluster.every(e=>typeof e.l6==='number');
    if(!haveAll){ blocking = {level:'l6', teamIds:cluster.map(e=>e.teamId)}; return [cluster]; }
    return clusterBy(cluster, e=>e.l6);
  });
  clusters = clusters.flatMap(cluster=>{
    if(cluster.length===1 || blocking) return [cluster];
    const haveAll = cluster.every(e=>typeof e.l3==='number');
    if(!haveAll){ blocking = {level:'l3', teamIds:cluster.map(e=>e.teamId)}; return [cluster]; }
    return clusterBy(cluster, e=>e.l3);
  });
  return { resolved: !blocking, clusters, blocking };
}

function manualPenalty(roundId, teamId){
  const m = state.manualPenalties && state.manualPenalties[roundId];
  return (m && typeof m[teamId]==='number') ? m[teamId] : 0;
}

// Walks rounds in day order, carrying each pair's running adjustment forward.
// A top-2/bottom-2 finish adds/subtracts its delta from whatever the pair is already
// carrying (stacks); any other finish leaves the running carry untouched.
// A manual penalty (set per-round) is folded into that one round's net alongside the
// carry, but — unlike the carry — is never added into what's carried into the next
// round, so it applies for exactly one day and then disappears on its own.
function computeAllRounds(){
  const n = state.teams.length;
  let carry = {}; state.teams.forEach(t=> carry[t.id]=0);
  let chainBroken = false;
  const out = {};

  state.rounds.forEach(r=>{
    if(chainBroken){
      out[r.id] = { started:false, resolved:false, blocking:null, waitingOnEarlierDay:true, results:null };
      return;
    }
    const rawEntries = state.teams.map(t=>{
      const s = getScore(r.id, t.id);
      return { teamId:t.id, f9:s.f9, b9:s.b9, l6:s.l6, l3:s.l3, gross: hasTotal(s) ? grossTotal(s) : null };
    });
    if(n===0 || rawEntries.some(e=>e.gross===null)){
      out[r.id] = { started: rawEntries.some(e=>e.gross!==null), resolved:false, blocking:null, results:null, adjBefore:{...carry} };
      chainBroken = true;
      return;
    }
    const entries = rawEntries.map(e=>{
      const manual = manualPenalty(r.id, e.teamId);
      return { ...e, net: e.gross + carry[e.teamId] + manual, adjBefore: carry[e.teamId], manual };
    });
    const { resolved, clusters, blocking } = buildOrder(entries);
    if(!resolved){
      out[r.id] = { started:true, resolved:false, blocking, results:null, adjBefore:{...carry} };
      chainBroken = true;
      return;
    }
    const results = {};
    let pos = 1;
    const nextCarry = {...carry};
    clusters.forEach(cluster=>{
      const rank = pos;
      let delta = 0;
      if(rank===1) delta=2; else if(rank===2) delta=1;
      else if(rank===n-1) delta=-1; else if(rank===n) delta=-2;
      cluster.forEach(e=>{
        const points = (n - rank + 1) * 2;
        results[e.teamId] = { rank, gross:e.gross, adjBefore:e.adjBefore, manual:e.manual, net:e.net, delta, points, tied: cluster.length>1 };
        nextCarry[e.teamId] = carry[e.teamId] + delta;
      });
      pos += cluster.length;
    });
    out[r.id] = { started:true, resolved:true, blocking:null, results, adjBefore:{...carry} };
    carry = nextCarry;
  });
  return out;
}

function standings(){
  const res = computeAllRounds();
  const table = state.teams.map(t=>{
    let net=0, points=0, roundsPlayed=0;
    state.rounds.forEach(r=>{
      const rr = res[r.id];
      if(rr && rr.resolved && rr.results[t.id]){
        net += rr.results[t.id].net;
        points += rr.results[t.id].points;
        roundsPlayed++;
      }
    });
    return { team:t, net, points, roundsPlayed };
  });
  return { table, res };
}

// Sorts standings for a given mode with a sensible tiebreak instead of
// falling back to arbitrary array order when two pairs are level.
function sortStandings(table, mode){
  return [...table].sort((a,b)=>{
    if(mode==='net'){
      if(a.net!==b.net) return a.net-b.net;
      return b.points-a.points; // tie on net: more GP points ranks higher
    } else {
      if(b.points!==a.points) return b.points-a.points;
      return a.net-b.net; // tie on points: lower net ranks higher
    }
  });
}

/* ---------- betting engine ---------- */
// Markets: 'overall' (the whole week) and one per round id (that day's winner).
// A market's state is derived on the fly from state.betting.bets except for
// status ('open'/'closed'/'settled') and the frozen winner list once settled,
// which are the only things actually stored per market.

function marketIds(){
  return ['overall', ...state.rounds.map(r=>r.id)];
}
function marketLabel(marketId){
  if(marketId==='overall') return 'Overall winner';
  const idx = state.rounds.findIndex(r=>r.id===marketId);
  const r = state.rounds[idx];
  return idx>=0 ? `Day ${idx+1} — ${r.course||'Course TBC'}` : marketId;
}
function getMarket(marketId){
  return (state.betting.markets && state.betting.markets[marketId]) || { status:'open' };
}
function marketBets(marketId){
  return Object.values(state.betting.bets||{}).filter(b=>b.marketId===marketId);
}
function marketPool(marketId){
  const bets = marketBets(marketId);
  const byTeam = {};
  let total = 0;
  bets.forEach(b=>{
    byTeam[b.teamId] = (byTeam[b.teamId]||0) + b.stake;
    total += b.stake;
  });
  return { total, byTeam, betCount: bets.length };
}
// Who actually won, for settling — independent of what's been bet on.
function marketWinners(marketId){
  if(marketId==='overall'){
    const { table, res } = standings();
    const allResolved = state.rounds.length>0 && state.rounds.every(r=>res[r.id] && res[r.id].resolved);
    if(!allResolved) return null;
    const played = table.filter(row=>row.roundsPlayed===state.rounds.length);
    if(played.length===0) return null;
    const lowest = Math.min(...played.map(row=>row.net));
    return played.filter(row=>row.net===lowest).map(row=>row.team.id);
  } else {
    const res = computeAllRounds();
    const rr = res[marketId];
    if(!rr || !rr.resolved) return null;
    return Object.keys(rr.results).filter(teamId=>rr.results[teamId].rank===1);
  }
}
function isMarketSettled(marketId){ return getMarket(marketId).status==='settled'; }
function settledWinners(marketId){
  const m = getMarket(marketId);
  return m.status==='settled' ? (m.winnerTeamIds||[]) : null;
}
// Payout per £1 staked on the winning side, and each bet's actual payout.
function marketPayouts(marketId){
  const winners = settledWinners(marketId);
  if(!winners) return null;
  const { total, byTeam } = marketPool(marketId);
  const onWinners = winners.reduce((sum,tid)=>sum+(byTeam[tid]||0), 0);
  const perPound = onWinners>0 ? total/onWinners : 0;
  const bets = marketBets(marketId).map(b=>({
    ...b,
    won: winners.includes(b.teamId),
    payout: winners.includes(b.teamId) ? Math.round(b.stake*perPound*100)/100 : 0
  }));
  return { total, onWinners, perPound, bets };
}

function ordinal(n){
  const s=["th","st","nd","rd"], v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}

    const rr = res[r.id];

    const manual = manualPenalty(r.id, t.id);
    const net = gross!==null ? gross + carry + manual : null;
    let badge = '';
    if(rr && rr.resolved && rr.results[t.id]){

      const dp = dailyPrize(d.rank);

function renderMatrix(){
  const { res } = standings();
  const { table } = standings();
  const sorted = sortStandings(table, lbMode);
  const head = state.rounds.map((r,i)=>`<th>D${i+1}</th>`).join('');
  const rows = sorted.map(row=>{
    const cells = state.rounds.map(r=>{
      const rr = res[r.id];
      if(!rr || !rr.resolved || !rr.results[row.team.id]){
        const marker = rr && rr.blocking ? '⚑' : (rr && rr.started ? '…' : '–');
        return `<td class="muted">${marker}</td>`;
      }
      const d = rr.results[row.team.id];
      let deltaStr = '';
      if(d.delta>0) deltaStr = `<span style="color:${'#B23A2E'}">+${d.delta}</span>`;
      else if(d.delta<0) deltaStr = `<span style="color:#2F6B3D">${d.delta}</span>`;
      const cellVal = lbMode==='points' ? d.points : d.net;
      return `<td>${cellVal}<br><span style="font-size:9px;color:var(--ink-soft)">${ordinal(d.rank)} ${deltaStr}</span></td>`;
    }).join('');
    return `<tr><td class="team-col">${esc(row.team.name)}</td>${cells}</tr>`;
  }).join('');
  return `<div class="card"><h2>Day by day</h2>
    <table class="matrix"><thead><tr><th class="team-col">Pair</th>${head}</tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="muted" style="margin-top:8px;">Net score and finishing position each day. ⚑ = tie awaiting countback. Red = adjustment added onto the next day's carry (1st/2nd), green = deducted (11th/12th) — this builds up across the week, not just from the day before.</div>
  </div>`;
}

      return `<div style="margin-top:10px;">
        <div class="tb-label" style="margin-bottom:4px;">${esc(t.name)}</div>
        <input type="number" inputmode="numeric" placeholder="${levelLabel} score" ${isAdmin?'':'disabled'} data-tb-team="${t.id}" data-tb-field="${nextLevel}" value="${val!==undefined?val:''}">
      </div>`;
    }).join('');
    tieBox = `<div class="card" style="border:2px solid #C9A83A;">
      <h2>⚑ Countback needed</h2>
      <div class="muted">${tiedTeams.length} pairs are level on net score.${isAdmin?` Enter their ${levelLabel} gross score to split them.`:' Waiting on the admin to enter the countback.'}</div>
      ${rows2}
    </div>`;
  }

  // Enter or check score — always a dropdown, never the full list.
  const ranked2 = state.teams.map(t=>{
    const d = result.resolved ? result.results[t.id] : null;
    return { t, rank: d ? d.rank : null };
  }).sort((a,b)=>{
    if(a.rank && b.rank) return a.rank-b.rank;
    if(a.rank) return -1;
    if(b.rank) return 1;
    return a.t.name.localeCompare(b.t.name);
  });
  const options = ranked2.map(({t,rank})=>`<option value="${t.id}" ${scoresDropdownTeam===t.id?'selected':''}>${rank?ordinal(rank)+' — ':''}${esc(t.name)}</option>`).join('');
  const selectedTeam = scoresDropdownTeam ? state.teams.find(t=>t.id===scoresDropdownTeam) : null;
  const scoreBox = `<div class="card">
    <h2>Enter or check score</h2>
    <label>Pair</label>
    <select id="score-team-picker">
      <option value="">Select a pair…</option>
      ${options}
    </select>
    ${selectedTeam ? `<div style="margin-top:10px;">${teamBlock(selectedTeam)}</div>` : '<div class="muted" style="margin-top:8px;">Pick a pair to enter or check their front 9 / back 9.</div>'}
  </div>`;

  // Manual adjustment — a one-off extra applied to THIS day's net only, either to
  // penalize an exceptional score or hand back some shots. Doesn't feed into the
  // running carry, so it's gone again from the day after. Admin-only.
  let manualBox = '';
  if(isAdmin){
    const currentPenalties = state.manualPenalties[round.id] || {};
    const penaltyRows = Object.keys(currentPenalties).map(teamId=>{
      const t = state.teams.find(x=>x.id===teamId);
      if(!t) return '';
      const amt = currentPenalties[teamId];
      return `<div class="team-item">
        <div class="tinfo"><div class="tname" style="color:var(--paper);">${esc(t.name)}</div><div class="tplayers">${signedNum(amt)} shots, this day only</div></div>
        <button class="icon-btn" data-del-manual="${teamId}">🗑️</button>
      </div>`;
    }).join('');
    const penaltyOptions = state.teams.filter(t=>currentPenalties[t.id]===undefined).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
    manualBox = `<div class="panel-dark">
      <h2>Manual adjustment</h2>
      <div class="muted-dark">For an exceptional score — adds or removes shots from a pair's net for this day only. Doesn't carry into the day after.</div>
      ${penaltyRows}
      <label>Pair</label>
      <select id="manual-team-picker">
        <option value="">Select a pair…</option>
        ${penaltyOptions}
      </select>
      <div class="toggle2" style="margin-top:10px;">
        <button type="button" id="manual-mode-penalty" class="manual-mode-btn ${manualMode==='penalty'?'active':''}" data-mode="penalty">Penalize (+)</button>
        <button type="button" id="manual-mode-help" class="manual-mode-btn ${manualMode==='help'?'active':''}" data-mode="help">Help (−)</button>
      </div>
      <label>Shots</label>
      <input type="number" inputmode="numeric" id="manual-amount" placeholder="e.g. 3">
      <button class="btn btn-ghost" id="add-manual">Add adjustment</button>
    </div>`;
  }

  return `${courseHeader}${winnersBox}${tieBox}${scoreBox}${manualBox}`;
}

function renderBetting(){
  if(!marketIds().includes(bettingMarket)) bettingMarket = 'overall';
  const marketPills = marketIds().map((mid,i)=>{
    const label = mid==='overall' ? 'Overall' : `D${i}`;
    const st = getMarket(mid).status;
    return `<button class="round-pill ${mid===bettingMarket?'active':''} ${st==='settled'?'done':''} ${st==='closed'?'tied':''}" data-market="${mid}">${label}</button>`;
  }).join('');

  const mid = bettingMarket;
  const market = getMarket(mid);
  const { total, byTeam, betCount } = marketPool(mid);
  const winners = marketWinners(mid);
  const settled = market.status==='settled';
  const payouts = settled ? marketPayouts(mid) : null;

  // Odds board — sorted most-backed (favourite) first.
  const board = state.teams.map(t=>{
    const staked = byTeam[t.id]||0;
    const perPound = staked>0 ? total/staked : null;
    return { t, staked, perPound };
  }).sort((a,b)=> b.staked-a.staked);

  const boardRows = board.map((row,idx)=>{
    const isFav = idx===0 && row.staked>0;
    const isWinner = settled && winners && winners.includes(row.t.id);
    return `<div class="lb-row">
      <div class="lb-pos ${isFav?'gold':''}">${isFav?'★':''}</div>
      <div class="lb-info">
        <div class="lb-team">${esc(row.t.name)}${isWinner?' <span class="chip minus">Winner</span>':''}</div>
        <div class="lb-players">${row.staked>0?money(row.staked)+' staked':'No bets yet'}</div>
      </div>
      <div>
        <div class="lb-val">${row.perPound!==null?row.perPound.toFixed(2)+'x':'—'}</div>
        <div class="lb-strokes">per £1</div>
      </div>
    </div>`;
  }).join('');

  const betRows = marketBets(mid).map(b=>{
    const t = state.teams.find(x=>x.id===b.teamId);
    const p = payouts ? payouts.bets.find(x=>x.id===b.id) : null;
    return `<div class="team-item">
      <div class="tinfo">
        <div class="tname" style="color:var(--paper);">${esc(b.name)} — ${esc(t?t.name:'?')}</div>
        <div class="tplayers">${money(b.stake)} staked${p ? (p.won ? ` · won ${money(p.payout)}` : ' · no return') : ''}</div>
      </div>
      ${isAdmin && !settled ? `<button class="icon-btn" data-del-bet="${b.id}">🗑️</button>` : ''}
    </div>`;
  }).join('');

  const teamOptions = state.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
  const canBet = market.status==='open' && !settled;

  let betForm = '';
  if(canBet){
    betForm = `<div class="card">
      <h2>Place a bet</h2>
      <label>Your name</label>
      <input type="text" id="bet-name" placeholder="Who's betting?">
      <label>Pair</label>
      <select id="bet-team"><option value="">Select a pair…</option>${teamOptions}</select>
      <label>Stake (£)</label>
      <input type="number" inputmode="numeric" id="bet-stake" placeholder="e.g. 5">
      <button class="btn btn-primary" id="place-bet">Place bet</button>
    </div>`;
  }

  let adminControls = '';
  if(isAdmin){
    const canSettle = market.status==='closed' && winners;
    adminControls = `<div class="panel-dark">
      <h2>Market admin</h2>
      <div class="muted-dark">Status: ${market.status}${winners && !settled ? ` — result known (${winners.map(id=>state.teams.find(t=>t.id===id)?.name).join(', ')})` : ''}</div>
      <div class="row2" style="margin-top:10px;">
        ${market.status==='open' ? `<button class="btn btn-ghost" id="close-market">Close betting</button>` : ''}
        ${market.status==='closed' ? `<button class="btn btn-ghost" id="open-market">Reopen betting</button>` : ''}
      </div>
      ${!settled ? `<button class="btn btn-primary" id="settle-market" ${canSettle?'':'disabled'}>Settle & pay out</button>` : ''}
      ${!settled && market.status==='open' ? `<div class="muted-dark" style="margin-top:6px;">Close betting before settling, and the result needs to be in first.</div>` : ''}
    </div>`;
  }

  const payoutSummary = settled && payouts ? `<div class="card">
    <h2>Payout</h2>
    <div class="muted">Pool: ${money(payouts.total)} · Staked on the winner: ${money(payouts.onWinners)} · Return: ${payouts.perPound.toFixed(2)}x per £1</div>
  </div>` : '';

  return `
    <div class="panel-dark">
      <h2>Tote betting</h2>
      <div class="muted-dark">Odds move with the money — the pair with the most staked is the favourite. Winners split the whole pool.</div>
      <div class="round-tabs" style="margin-top:14px;">${marketPills}</div>
    </div>
    <div class="card">
      <h2>${esc(marketLabel(mid))}</h2>
      <div class="muted" style="margin-bottom:8px;">${betCount} bet${betCount===1?'':'s'} · ${money(total)} in the pool</div>
      ${boardRows || '<div class="empty">No bets placed yet.</div>'}
    </div>
    ${payoutSummary}
    ${betForm}
    ${betCount>0 ? `<div class="card"><h2>All bets</h2>${betRows}</div>` : ''}
    ${adminControls}
  `;
}

function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- edit team inline ---------- */
function editTeamInline(teamId){
  const t = state.teams.find(x=>x.id===teamId);
  if(!t) return;
  const view = document.getElementById('view');
  const wrap = document.createElement('div');
  wrap.className = 'panel-dark';
  wrap.style.marginTop = '14px';
  wrap.innerHTML = `
    <h2>Edit pair</h2>
    <label>Pair name</label>
    <input type="text" id="et-name" value="${esc(t.name)}">
    <div class="row2">
      <div><label>Player 1</label><input type="text" id="et-p1" value="${esc(t.p1)}"></div>
      <div><label>Player 2</label><input type="text" id="et-p2" value="${esc(t.p2)}"></div>
    </div>
    <button class="btn btn-primary" id="et-save">Save pair</button>
    <button class="btn btn-danger" id="et-delete">Delete pair</button>
  `;
  view.prepend(wrap);
  wrap.scrollIntoView({behavior:'smooth', block:'center'});
  document.getElementById('et-save').onclick = ()=>{
    t.name = document.getElementById('et-name').value.trim() || t.name;
    t.p1 = document.getElementById('et-p1').value.trim();
    t.p2 = document.getElementById('et-p2').value.trim();
    save(); toast('Pair saved'); render();
  };
  document.getElementById('et-delete').onclick = ()=>{
    if(confirm('Delete '+t.name+'? This removes their scores from every round.')){
      state.teams = state.teams.filter(x=>x.id!==teamId);
      state.rounds.forEach(r=>{ if(state.scores[r.id]) delete state.scores[r.id][teamId]; });
      save(); toast('Pair deleted'); render();
    }
  };
}

function attachHandlers(){
  document.querySelectorAll('.tabbar button').forEach(b=>{
    b.onclick = ()=>{ activeTab = b.dataset.tab; render(); window.scrollTo(0,0); };
  });

  document.querySelectorAll('[data-lb]').forEach(b=>{
    b.onclick = ()=>{ lbMode = b.dataset.lb; render(); };
  });

  document.querySelectorAll('[data-team-detail]').forEach(b=>{
    b.onclick = ()=>{ overallEditTeam = b.dataset.teamDetail; render(); window.scrollTo(0,0); };
  });
  const closeDetail = document.querySelector('[data-close-team-detail]');
  if(closeDetail) closeDetail.onclick = (e)=>{ e.stopPropagation(); overallEditTeam = null; render(); };

  document.querySelectorAll('[data-round]').forEach(b=>{
    b.onclick = ()=>{ state.activeRound = b.dataset.round; scoresDropdownTeam = null; save(); render(); };
  });
  const teamPicker = document.getElementById('score-team-picker');
  if(teamPicker) teamPicker.onchange = ()=>{ scoresDropdownTeam = teamPicker.value || null; render(); };
  const gotoCourses = document.querySelector('[data-goto-courses]');
  if(gotoCourses) gotoCourses.onclick = ()=>{ activeTab = 'courses'; render(); window.scrollTo(0,0); };
  const addManualBtn = document.getElementById('add-manual');
  if(addManualBtn) addManualBtn.onclick = ()=>{
    const teamSel = document.getElementById('manual-team-picker');
    const amtInp = document.getElementById('manual-amount');
    const teamId = teamSel.value;
    const rawAmt = parseInt(amtInp.value,10);
    if(!teamId){ toast('Pick a pair first'); return; }
    if(isNaN(rawAmt) || rawAmt===0){ toast('Enter a shots amount'); return; }
    const amt = manualMode==='help' ? -Math.abs(rawAmt) : Math.abs(rawAmt);
    if(!state.manualPenalties[state.activeRound]) state.manualPenalties[state.activeRound] = {};
    state.manualPenalties[state.activeRound][teamId] = amt;
    saveField({ [`manualPenalties.${state.activeRound}.${teamId}`]: amt });
    toast('Manual adjustment added'); render();
  };
  document.querySelectorAll('.manual-mode-btn').forEach(b=>{
    b.onclick = ()=>{ manualMode = b.dataset.mode; render(); };
  });
  document.querySelectorAll('[data-del-manual]').forEach(b=>{
    b.onclick = ()=>{
      const teamId = b.dataset.delManual;
      if(state.manualPenalties[state.activeRound]) delete state.manualPenalties[state.activeRound][teamId];
      saveField({ [`manualPenalties.${state.activeRound}.${teamId}`]: deleteField() });
      toast('Removed'); render();
    };
  });

  // Betting
  document.querySelectorAll('[data-market]').forEach(b=>{
    b.onclick = ()=>{ bettingMarket = b.dataset.market; render(); };
  });
  const placeBetBtn = document.getElementById('place-bet');
  if(placeBetBtn) placeBetBtn.onclick = ()=>{
    const nameInp = document.getElementById('bet-name');
    const teamSel = document.getElementById('bet-team');
    const stakeInp = document.getElementById('bet-stake');
    const name = nameInp.value.trim();
    const teamId = teamSel.value;
    const stake = parseFloat(stakeInp.value);
    if(!name){ toast('Enter a name'); return; }
    if(!teamId){ toast('Pick a pair'); return; }
    if(isNaN(stake) || stake<=0){ toast('Enter a stake'); return; }
    const betId = uid('bet');
    const bet = { id: betId, marketId: bettingMarket, name, teamId, stake, placedAt: Date.now() };
    state.betting.bets[betId] = bet;
    saveField({ [`betting.bets.${betId}`]: bet });
    toast('Bet placed'); render();
  };
  document.querySelectorAll('[data-del-bet]').forEach(b=>{
    b.onclick = ()=>{
      const betId = b.dataset.delBet;
      delete state.betting.bets[betId];
      saveField({ [`betting.bets.${betId}`]: deleteField() });
      toast('Bet removed'); render();
    };
  });
  const closeMarketBtn = document.getElementById('close-market');
  if(closeMarketBtn) closeMarketBtn.onclick = ()=>{
    if(!state.betting.markets[bettingMarket]) state.betting.markets[bettingMarket] = {};
    state.betting.markets[bettingMarket].status = 'closed';
    saveField({ [`betting.markets.${bettingMarket}`]: { status:'closed' } });
    toast('Betting closed'); render();
  };
  const openMarketBtn = document.getElementById('open-market');
  if(openMarketBtn) openMarketBtn.onclick = ()=>{
    if(!state.betting.markets[bettingMarket]) state.betting.markets[bettingMarket] = {};
    state.betting.markets[bettingMarket].status = 'open';
    saveField({ [`betting.markets.${bettingMarket}`]: { status:'open' } });
    toast('Betting reopened'); render();
  };
  const settleMarketBtn = document.getElementById('settle-market');
  if(settleMarketBtn) settleMarketBtn.onclick = ()=>{
    const winners = marketWinners(bettingMarket);
    if(!winners){ toast('Result not known yet'); return; }
    if(!confirm('Settle this market and pay out now? This can\'t be undone.')) return;
    const marketData = { status:'settled', winnerTeamIds: winners };
    state.betting.markets[bettingMarket] = marketData;
    saveField({ [`betting.markets.${bettingMarket}`]: marketData });
    toast('Market settled'); render();
  };

  document.querySelectorAll('[data-score-team]').forEach(inp=>{
    inp.onchange = ()=>{
      const teamId = inp.dataset.scoreTeam;
      const field = inp.dataset.scoreField;
      const roundId = inp.dataset.scoreRound || state.activeRound;
      const v = inp.value==='' ? null : parseInt(inp.value,10);
      saveScoreField(roundId, teamId, field, v);
      render();
    };
  });
  document.querySelectorAll('[data-tb-team]').forEach(inp=>{
    inp.onchange = ()=>{
      const teamId = inp.dataset.tbTeam;
      const field = inp.dataset.tbField;
      const v = inp.value==='' ? null : parseInt(inp.value,10);
      saveScoreField(state.activeRound, teamId, field, v);
      render();
    };
  });

  const addRound = document.getElementById('add-round');
  if(addRound) addRound.onclick = ()=>{
    const r = {id:uid('r'), course:'', date:''};
    state.rounds.push(r);
    if(!state.activeRound) state.activeRound = r.id;
    save(); render();
  };
  document.querySelectorAll('[data-course-name]').forEach(inp=>{
    inp.onchange = ()=>{
      const r = state.rounds.find(x=>x.id===inp.dataset.courseName);
      r.course = inp.value.trim();
      save(); render();
    };
  });
  document.querySelectorAll('[data-course-date]').forEach(inp=>{
    inp.onchange = ()=>{
      const r = state.rounds.find(x=>x.id===inp.dataset.courseDate);
      r.date = inp.value;
      save(); render();
    };
  });
  document.querySelectorAll('[data-del-round]').forEach(b=>{
    b.onclick = ()=>{
      const rid = b.dataset.delRound;
      const r = state.rounds.find(x=>x.id===rid);
      if(confirm('Delete this day'+(r.course?' ('+r.course+')':'')+' and its scores?')){
        state.rounds = state.rounds.filter(x=>x.id!==rid);
        delete state.scores[rid];
        if(state.activeRound===rid) state.activeRound = state.rounds[0] ? state.rounds[0].id : null;
        save(); render();
      }
    };
  });

  const unlockBtn = document.getElementById('unlock-admin');
  if(unlockBtn) unlockBtn.onclick = ()=>{
    const pinInp = document.getElementById('admin-pin-input');
    if(pinInp.value === ADMIN_PIN){
      isAdmin = true;
      localStorage.setItem('sp2026_admin','yes');
      toast('Admin unlocked'); render();
    } else {
      toast('Wrong PIN');
    }
  };
  const lockBtn = document.getElementById('lock-admin');
  if(lockBtn) lockBtn.onclick = ()=>{
    isAdmin = false;
    localStorage.removeItem('sp2026_admin');
    toast('Admin locked'); render();
  };
  const addTeam = document.getElementById('add-team');
  if(addTeam) addTeam.onclick = ()=>{
    state.teams.push({id:uid('t'), name:'Pair '+(state.teams.length+1), p1:'', p2:''});
    save(); render();
  };
  document.querySelectorAll('[data-edit-team]').forEach(b=>{
    b.onclick = ()=> editTeamInline(b.dataset.editTeam);
  });
  document.querySelectorAll('[data-prize]').forEach(inp=>{
    inp.onchange = ()=>{
      const [group, idx] = inp.dataset.prize.split('-');
      const v = parseInt(inp.value,10);
      state.prizes[group][parseInt(idx,10)] = isNaN(v) ? 0 : v;
      save(); render();
    };
  });

  const expBtn = document.getElementById('export-data');
  if(expBtn) expBtn.onclick = ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'scottish-pairs-2026-backup.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Backup downloaded');
  };
  const impBtn = document.getElementById('import-data');
  if(impBtn) impBtn.onclick = ()=>{
    const inputEl = document.createElement('input');
    inputEl.type = 'file'; inputEl.accept = 'application/json';
    inputEl.onchange = ()=>{
      const file = inputEl.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const data = JSON.parse(reader.result);
          if(!data.teams || !data.rounds) throw new Error('bad file');
          state = data; save(); toast('Data imported'); render();
        }catch(e){ alert('That file could not be read as a Scottish Pairs backup.'); }
      };
      reader.readAsText(file);
    };
    inputEl.click();
  };
  const resetScoresBtn = document.getElementById('reset-scores');
  if(resetScoresBtn) resetScoresBtn.onclick = ()=>{
    if(confirm('Clear every score for EVERYONE using this link? Pairings, courses and prizes stay as they are. This cannot be undone.')){
      state.scores = {};
      state.activeRound = state.rounds[0] ? state.rounds[0].id : null;
      save(); toast('Scores reset'); render();
    }
  };
  const resetBtn = document.getElementById('reset-data');
  if(resetBtn) resetBtn.onclick = ()=>{
    if(confirm('Reset all pairs, rounds and scores for EVERYONE using this link? This cannot be undone.')){
      state = defaultState(); save(); toast('Reset'); render();
    }
  };
}

/* ---------- dynamic manifest (installable PWA, single file) ---------- */
(function(){
  const iconSvg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230065BD'/><line x1='6' y1='6' x2='94' y2='94' stroke='white' stroke-width='20'/><line x1='94' y1='6' x2='6' y2='94' stroke='white' stroke-width='20'/></svg>";
  const iconUrl = "data:image/svg+xml," + iconSvg;
  const manifest = {
    name: "Scottish Pairs 2026",
    short_name: "Scottish Pairs",
    start_url: ".",
    display: "standalone",
    background_color: "#0F2418",
    theme_color: "#0F2418",
    icons: [ { src: iconUrl, sizes: "any", type: "image/svg+xml" } ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
})();

document.getElementById('view').innerHTML = '<div class="card"><div class="empty">Loading…</div></div>';
</script>
</body>
